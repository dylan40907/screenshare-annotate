<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screenshare Annotate</title>
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <div class="card">
    <h1>Screenshare Annotate</h1>
    <p class="sub">Draw on any shared screen or window, together - in real time.</p>

    <label>Sync server</label>
    <input id="server" type="text" placeholder="ws://localhost:4321" />

    <label>Room</label>
    <input id="room" type="text" placeholder="team-standup" />

    <label>Your name</label>
    <input id="name" type="text" placeholder="Dylan" />

    <label>Role</label>
    <div class="choices">
      <button class="choice role active" data-role="share">Share</button>
      <button class="choice role" data-role="view">View</button>
    </div>

    <!-- SHARER: choose what to share -->
    <div id="shareOnly">
      <label>What are you sharing?</label>
      <div class="choices">
        <button class="choice stype active" data-stype="window">Application</button>
        <button class="choice stype" data-stype="screen">Entire screen</button>
      </div>

      <div id="windowPick">
        <label>Application window
          <button id="refreshWins" class="mini">↻ refresh</button>
        </label>
        <select id="windowSel"></select>
      </div>

      <div id="screenPick" style="display:none">
        <label>Monitor</label>
        <select id="displayShare"></select>
      </div>
    </div>

    <!-- VIEWER: which monitor they watch on -->
    <div id="viewOnly" style="display:none">
      <label>Overlay monitor</label>
      <select id="displayView"></select>
    </div>

    <button id="connect" class="primary">Launch overlay</button>
    <p class="status" id="status"></p>
  </div>
  <script src="control.js"></script>
</body>
</html>
