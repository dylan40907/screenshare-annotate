<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screenshare Annotate</title>
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>Screenshare Annotate</h1>
        <p class="sub">Draw on any shared screen or window, together, in real time.</p>
      </div>
      <button id="gear" class="gear" title="Settings">⚙</button>
    </div>

    <!-- MAIN VIEW -->
    <div id="mainView">
      <label>Room</label>
      <input id="room" type="text" placeholder="room name" />

      <label>Role</label>
      <div class="choices">
        <button class="choice role active" data-role="share">Share</button>
        <button class="choice role" data-role="view">View</button>
      </div>

      <!-- SHARER: choose what to share -->
      <div id="shareOnly">
        <label>What are you sharing?</label>
        <div class="choices">
          <button class="choice stype active" data-stype="screen">Entire screen</button>
          <button class="choice stype" data-stype="window">Application</button>
        </div>

        <div id="windowPick" style="display:none">
          <label>Application window
            <button id="refreshWins" class="mini">↻ refresh</button>
          </label>
          <select id="windowSel"></select>
        </div>

        <div id="screenPick">
          <label>Monitor</label>
          <select id="displayShare"></select>
        </div>
      </div>

      <!-- VIEWER: which monitor they watch on -->
      <div id="viewOnly" style="display:none">
        <label>Overlay monitor</label>
        <select id="displayView"></select>
      </div>

      <button id="connect" class="primary">Launch overlay</button>
      <p class="status" id="status"></p>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="settingsView" style="display:none">
      <p class="settings-hint" id="settingsHint"></p>

      <label>Your name</label>
      <input id="username" type="text" placeholder="your name" />

      <label>Sync server</label>
      <input id="server" type="text" placeholder="wss://…" />

      <label>Screenshot folder</label>
      <div class="folder-row">
        <span id="folderPath" class="folder-path"></span>
        <button id="chooseShotDir" class="mini">Change…</button>
      </div>

      <button id="settingsDone" class="primary">Done</button>
    </div>
  </div>
  <script src="control.js"></script>
</body>
</html>
